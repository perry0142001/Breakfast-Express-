<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakfast Express</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#fff8ed;color:#333}
header{background:#e87516;color:white;padding:20px;text-align:center}
.container{padding:15px;max-width:700px;margin:auto}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc;font-size:15px}
button{background:#e87516;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#444}
.hidden{display:none!important}
h2{color:#d96712}
.item{border-bottom:1px solid #ddd;padding:12px 0}
.small{font-size:13px;color:#666}
</style>
</head>
<body><header>
<h1>🍽️ Breakfast Express</h1>
<p>તમારો નાસ્તો, હવે તમારા ઘરે!</p>
</header><div class="container"><div class="card" id="authSection">
<h2>Login / Register</h2>
<input id="emailInput" type="email" placeholder="Email address">
<input id="passwordInput" type="password" placeholder="Password">
<button id="loginButton">Login</button>
<button id="registerButton">Create Account</button>
<p id="authMessage"></p>
</div><div id="appSection" class="hidden"><div class="card">
<h2>Welcome!</h2>
<p id="userEmail"></p>
<button id="logoutButton" class="secondary">Logout</button>
</div><div class="card">
<h2>Register Your Shop</h2>
<input id="shopNameInput" placeholder="Shop name">
<input id="ownerNameInput" placeholder="Owner name">
<input id="shopPhoneInput" placeholder="Mobile number">
<input id="shopAddressInput" placeholder="Shop address">
<select id="shopAreaInput">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="shopRegisterButton">Submit Shop for Approval</button>
<p id="shopMessage"></p>
</div><div class="card">
<h2>Available Shops</h2>
<div id="shopsList">Loading shops...</div>
</div><div class="card">
<h2>My Orders</h2>
<div id="myOrdersList"></div>
</div><div class="card hidden" id="adminPanel">
<h2>👑 Admin Dashboard</h2><h3>Shop Registrations</h3>
<div id="adminShopsList"></div><h3>Add Shop Manually</h3>
<input id="newShopName" placeholder="Shop name">
<input id="newShopPhone" placeholder="Phone">
<input id="newShopAddress" placeholder="Address">
<select id="newShopArea">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="addShopButton">Add Approved Shop</button><h3>All Customer Orders</h3>
<div id="adminOrdersList"></div>
</div></div>
</div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
doc,
updateDoc,
deleteDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);

const firebaseConfig = {
apiKey: "AIzaSyBmLCgp-lhyVBZ18uIaGs785H55o6LcFi8",
authDomain: "project-2153778259975197488.firebaseapp.com",
projectId: "project-2153778259975197488",
storageBucket: "project-2153778259975197488.firebasestorage.app",
messagingSenderId: "854726959400",
appId: "1:854726959400:web:fc87228ca991e1a8b4b01d",
measurementId: "G-S1CFHKMLEY"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const ADMIN_UID = "SdcB4AZJ9bhNgroY7vXH7a7MN0H2";

$("loginButton").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  $("authMessage").textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    $("authMessage").textContent = "Login successful!";
  } catch (error) {
    $("authMessage").textContent = error.message;
  }
});

$("registerButton").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  $("authMessage").textContent = "Creating account...";

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    $("authMessage").textContent = "Account created successfully!";
  } catch (error) {
    $("authMessage").textContent = error.message;
  }
});

$("logoutButton").addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, async user => {
  $("authSection").classList.toggle("hidden", !!user);
  $("appSection").classList.toggle("hidden", !user);

  if (!user) {
    $("adminPanel").classList.add("hidden");
    return;
  }

  $("userEmail").textContent = user.email || "";

  const isAdmin = user.uid === ADMIN_UID;
  $("adminPanel").classList.toggle("hidden", !isAdmin);

  await loadShops();
  await loadMyOrders();

  if (isAdmin) {
    await loadAdmin();
  }
});

$("shopRegisterButton").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return;

  const name = $("shopNameInput").value.trim();
  const ownerName = $("ownerNameInput").value.trim();
  const phone = $("shopPhoneInput").value.trim();
  const address = $("shopAddressInput").value.trim();

  if (!name || !phone || !address) {
    $("shopMessage").textContent = "Please fill in shop name, phone and address.";
    return;
  }

  try {
    await addDoc(collection(db, "shops"), {
      name,
      ownerName,
      phone,
      address,
      area: $("shopAreaInput").value,
      ownerId: user.uid,
      approved: false,
      active: true,
      menu: [],
      createdAt: serverTimestamp()
    });

    $("shopMessage").textContent = "Shop submitted for admin approval.";
    $("shopNameInput").value = "";
    $("ownerNameInput").value = "";
    $("shopPhoneInput").value = "";
    $("shopAddressInput").value = "";

    if (user.uid === ADMIN_UID) await loadAdmin();

  } catch (error) {
    $("shopMessage").textContent = error.message;
  }
});

async function loadShops() {
  $("shopsList").textContent = "Loading shops...";

  try {
    const q = query(
      collection(db, "shops"),
      where("approved", "==", true),
      where("active", "==", true)
    );

    const snapshot = await getDocs(q);
    const list = $("shopsList");
    list.innerHTML = "";

    if (snapshot.empty) {
      list.textContent = "No approved shops available yet.";
      return;
    }

    snapshot.forEach(shopDoc => {
      const shop = shopDoc.data();
      const div = document.createElement("div");
      div.className = "item";

      const name = document.createElement("h3");
      name.textContent = shop.name || "Shop";

      const details = document.createElement("p");
      details.textContent =
        (shop.area || "") + " | " +
        (shop.address || "") + " | " +
        (shop.phone || "");

      const button = document.createElement("button");
      button.textContent = "Place Order";
      button.addEventListener("click", () =>
        placeOrder(shopDoc.id, shop.name || "Shop")
      );

      div.append(name, details, button);
      list.appendChild(div);
    });

  } catch (error) {
    $("shopsList").textContent = error.message;
  }
}

async function placeOrder(shopId, shopName) {
  const items = prompt("Enter food item and quantity:");
  if (!items) return;

  const total = Number(prompt("Enter total amount in rupees:"));
  if (!Number.isFinite(total) || total <= 0) {
    alert("Please enter a valid amount.");
    return;
  }

  const address = prompt("Enter delivery address:");
  if (!address) return;

  try {
    await addDoc(collection(db, "orders"), {
      customerId: auth.currentUser.uid,
      shopId,
      shopName,
      items,
      total,
      address,
      status: "New",
      createdAt: serverTimestamp()
    });

    alert("Order placed successfully!");
    await loadMyOrders();

  } catch (error) {
    alert(error.message);
  }
}

async function loadMyOrders() {
  $("myOrdersList").textContent = "Loading orders...";

  try {
    const q = query(
      collection(db, "orders"),
      where("customerId", "==", auth.currentUser.uid)
    );

    const snapshot = await getDocs(q);
    const list = $("myOrdersList");
    list.innerHTML = "";

    if (snapshot.empty) {
      list.textContent = "You have not placed any orders yet.";
      return;
    }

    snapshot.forEach(orderDoc => {
      const order = orderDoc.data();
      const div = document.createElement("div");
      div.className = "item";

      const details = document.createElement("p");
      details.textContent =
        (order.shopName || "Shop") + " | " +
        (order.items || "") + " | ₹" +
        order.total + " | Status: " + order.status;

      div.appendChild(details);
      list.appendChild(div);
    });

  } catch (error) {
    $("myOrdersList").textContent = error.message;
  }
}

async function loadAdmin() {
  try {
    const shopSnapshot = await getDocs(collection(db, "shops"));
    const shopList = $("adminShopsList");
    shopList.innerHTML = "";

    shopSnapshot.forEach(shopDoc => {
      const shop = shopDoc.data();
      const div = document.createElement("div");
      div.className = "item";

      const details = document.createElement("p");
      details.textContent =
        (shop.name || "Shop") + " | " +
        (shop.area || "") + " | " +
        (shop.approved ? "Approved" : "Pending");

      div.appendChild(details);

      if (!shop.approved) {
        const approve = document.createElement("button");
        approve.textContent = "Approve Shop";
        approve.addEventListener("click", () =>
          approveShop(shopDoc.id)
        );
        div.appendChild(approve);
      }

      const remove = document.createElement("button");
      remove.textContent = "Delete Shop";
      remove.className = "secondary";
      remove.addEventListener("click", () =>
        removeShop(shopDoc.id)
      );

      div.appendChild(remove);
      shopList.appendChild(div);
    });

    const orderSnapshot = await getDocs(collection(db, "orders"));
    const orderList = $("adminOrdersList");
    orderList.innerHTML = "";

    if (orderSnapshot.empty) {
      orderList.textContent = "No orders yet.";
    }

    orderSnapshot.forEach(orderDoc => {
      const order = orderDoc.data();
      const div = document.createElement("div");
      div.className = "item";

      const details = document.createElement("p");
      details.textContent =
        (order.shopName || "Shop") + " | " +
        (order.items || "") + " | ₹" +
        order.total + " | " +
        (order.address || "") + " | Status: " +
        order.status;

      div.appendChild(details);

      if (order.status !== "Completed") {
        const button = document.createElement("button");
        button.textContent = "Mark Completed";
        button.addEventListener("click", () =>
          completeOrder(orderDoc.id)
        );
        div.appendChild(button);
      }

      orderList.appendChild(div);
    });

  } catch (error) {
    $("adminShopsList").textContent = error.message;
    $("adminOrdersList").textContent = error.message;
  }
}

async function approveShop(id) {
  try {
    await updateDoc(doc(db, "shops", id), {
      approved: true
    });
    alert("Shop approved!");
    await loadAdmin();
    await loadShops();
  } catch (error) {
    alert(error.message);
  }
}

async function removeShop(id) {
  if (!confirm("Are you sure you want to delete this shop?")) return;

  try {
    await deleteDoc(doc(db, "shops", id));
    await loadAdmin();
    await loadShops();
  } catch (error) {
    alert(error.message);
  }
}

async function completeOrder(id) {
  try {
    await updateDoc(doc(db, "orders", id), {
      status: "Completed"
    });
    await loadAdmin();
  } catch (error) {
    alert(error.message);
  }
}

$("addShopButton").addEventListener("click", async () => {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin access required.");
    return;
  }

  const name = $("newShopName").value.trim();
  if (!name) {
    alert("Enter shop name.");
    return;
  }

  try {
    await addDoc(collection(db, "shops"), {
      name,
      phone: $("newShopPhone").value.trim(),
      address: $("newShopAddress").value.trim(),
      area: $("newShopArea").value,
      ownerId: ADMIN_UID,
      approved: true,
      active: true,
      menu: [],
      createdAt: serverTimestamp()
    });

    alert("Shop added successfully!");

    $("newShopName").value = "";
    $("newShopPhone").value = "";
    $("newShopAddress").value = "";

    await loadAdmin();
    await loadShops();

  } catch (error) {
    alert(error.message);
  }
});

</script></body>
</html>
