<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakfast Express</title>
<style>
body{font-family:Arial;margin:0;background:#fff8ed;color:#333}
header{background:#e87516;color:white;padding:20px;text-align:center}
.container{padding:15px;max-width:650px;margin:auto}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border-radius:7px;border:1px solid #ccc;font-size:15px}
button{background:#e87516;color:white;border:0;font-weight:bold}
.secondary{background:#444}
.hidden{display:none}
h2{color:#d96712}
.item{border-bottom:1px solid #ddd;padding:10px 0}
</style>
</head>
<body>

<header>
<h1>🍽️ Breakfast Express</h1>
<p>તમારો નાસ્તો, હવે તમારા ઘરે!</p>
</header>

<div class="container">

<div class="card" id="auth">
<h2>Login / Register</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Create Account</button>
<p id="message"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<h2>Welcome!</h2>
<p id="userEmail"></p>
<button onclick="logout()" class="secondary">Logout</button>
</div>

<div class="card">
<h2>Register Your Shop</h2>
<input id="shopName" placeholder="Shop name">
<input id="ownerName" placeholder="Owner name">
<input id="shopPhone" placeholder="Mobile number">
<input id="shopAddress" placeholder="Shop address">
<select id="shopArea">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button onclick="registerShop()">Submit Shop for Approval</button>
</div>

<div class="card">
<h2>Available Shops</h2>
<div id="shops">Loading shops...</div>
</div>

<div class="card">
<h2>My Orders</h2>
<div id="myOrders"></div>
</div>

<div class="card hidden" id="adminPanel">
<h2>👑 Admin Dashboard</h2>
<h3>Shop Registrations</h3>
<div id="adminShops"></div>
<h3>All Orders</h3>
<div id="adminOrders"></div>
<h3>Add Shop Manually</h3>
<input id="newShopName" placeholder="Shop name">
<input id="newShopPhone" placeholder="Phone">
<input id="newShopAddress" placeholder="Address">
<select id="newShopArea">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button onclick="addShop()">Add Approved Shop</button>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth, createUserWithEmailAndPassword,
signInWithEmailAndPassword, signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore, collection, addDoc, getDocs,
query, where, doc, updateDoc, deleteDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBmLCgp-lhyVBZ18uIaGs785H55o6LcFi8",
authDomain: "project-2153778259975197488.firebaseapp.com",
projectId: "project-2153778259975197488",
storageBucket: "project-2153778259975197488.firebasestorage.app",
messagingSenderId: "854726959400",
appId: "1:854726959400:web:fc87228ca991e1a8b4b01d",
measurementId: "G-S1CFHKMLEY"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const ADMIN_UID = "SdcB4AZJ9bhNgroY7vXH7a7MN0H2";

window.login = async function(){
try{
await signInWithEmailAndPassword(auth,email.value,password.value);
message.innerText="Login successful";
}catch(e){message.innerText=e.message;}
};

window.register = async function(){
try{
await createUserWithEmailAndPassword(auth,email.value,password.value);
message.innerText="Account created";
}catch(e){message.innerText=e.message;}
};

window.logout = async function(){
await signOut(auth);
};

onAuthStateChanged(auth,async user=>{
authDiv(user);
if(user){
await loadShops();
await loadOrders();
if(user.uid===ADMIN_UID){
adminPanel.classList.remove("hidden");
await loadAdmin();
}
}
});

function authDiv(user){
auth.classList.toggle("hidden",!!user);
document.getElementById("app").classList.toggle("hidden",!user);
if(user)userEmail.innerText=user.email;
}

window.registerShop = async function(){
const user=auth.currentUser;
if(!user)return alert("Please login first");

try{
await addDoc(collection(db,"shops"),{
name:shopName.value,
ownerName:ownerName.value,
phone:shopPhone.value,
address:shopAddress.value,
area:shopArea.value,
ownerId:user.uid,
approved:false,
active:true,
menu:[],
createdAt:serverTimestamp()
});
alert("Shop registration submitted for admin approval");
}catch(e){alert(e.message);}
};

async function loadShops(){
try{
const q=query(collection(db,"shops"),
where("approved","==",true),
where("active","==",true));
const snap=await getDocs(q);
shops.innerHTML="";
snap.forEach(d=>{
const s=d.data();
shops.innerHTML+=`
<div class="item">
<h3>${s.name}</h3>
<p>${s.area} | ${s.address||""}</p>
<p>Phone: ${s.phone||""}</p>
<button onclick="orderShop('${d.id}','${s.name}')">Place Order</button>
</div>`;
});
if(snap.empty)shops.innerText="No approved shops available yet.";
}catch(e){shops.innerText=e.message;}
}

window.orderShop = async function(id,name){
const item=prompt("Enter food item and quantity:");
if(!item)return;
const price=Number(prompt("Enter total amount (₹):"));
if(!Number.isFinite(price)||price<=0)return alert("Enter a valid amount");

const address=prompt("Enter delivery address:");
if(!address)return;

try{
await addDoc(collection(db,"orders"),{
customerId:auth.currentUser.uid,
shopId:id,
shopName:name,
items:item,
total:price,
address:address,
status:"New",
createdAt:serverTimestamp()
});
alert("Order placed successfully");
await loadOrders();
}catch(e){alert(e.message);}
};

async function loadOrders(){
try{
const q=query(collection(db,"orders"),
where("customerId","==",auth.currentUser.uid));
const snap=await getDocs(q);
myOrders.innerHTML="";
snap.forEach(d=>{
const o=d.data();
myOrders.innerHTML+=`<div class="item">
${o.shopName}<br>${o.items}<br>
₹${o.total}<br>Status: ${o.status}
</div>`;
});
}catch(e){myOrders.innerText=e.message;}
}

async function loadAdmin(){
const shopSnap=await getDocs(collection(db,"shops"));
adminShops.innerHTML="";
shopSnap.forEach(d=>{
const s=d.data();
adminShops.innerHTML+=`
<div class="item">
<b>${s.name}</b> - ${s.area}
<p>${s.approved?"Approved":"Pending"}</p>
<button onclick="approveShop('${d.id}')">Approve Shop</button>
<button class="secondary" onclick="removeShop('${d.id}')">Delete Shop</button>
</div>`;
});

const orderSnap=await getDocs(collection(db,"orders"));
adminOrders.innerHTML="";
orderSnap.forEach(d=>{
const o=d.data();
adminOrders.innerHTML+=`
<div class="item">
<b>${o.shopName}</b><br>${o.items}<br>
₹${o.total}<br>${o.address}<br>
Status: ${o.status}
<button onclick="completeOrder('${d.id}')">Mark Completed</button>
</div>`;
});
}

window.approveShop=async function(id){
await updateDoc(doc(db,"shops",id),{approved:true});
alert("Shop approved");
await loadAdmin();
await loadShops();
};

window.removeShop=async function(id){
if(confirm("Delete this shop?")){
await deleteDoc(doc(db,"shops",id));
await loadAdmin();
await loadShops();
}
};

window.completeOrder=async function(id){
await updateDoc(doc(db,"orders",id),{status:"Completed"});
await loadAdmin();
};

window.addShop=async function(){
try{
await addDoc(collection(db,"shops"),{
name:newShopName.value,
phone:newShopPhone.value,
address:newShopAddress.value,
area:newShopArea.value,
ownerId:auth.currentUser.uid,
approved:true,
active:true,
menu:[],
createdAt:serverTimestamp()
});
alert("Shop added successfully");
await loadAdmin();
await loadShops();
}catch(e){alert(e.message);}
};
</script>
</body>
</html>
