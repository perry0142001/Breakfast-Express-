<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakfast Express</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#fff8ed;color:#333}
header{background:#e87516;color:white;padding:18px;text-align:center}
.container{max-width:700px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 7px #ddd}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#e87516;color:white;border:0;font-weight:bold}
.secondary{background:#444}
.hidden{display:none!important}
h2{color:#d96712}
.item{padding:12px 0;border-bottom:1px solid #ddd}
</style>
</head>
<body>

<header>
<h1>🍽️ Breakfast Express</h1>
<p>તમારો નાસ્તો, હવે તમારા ઘરે!</p>
</header>

<div class="container">

<div class="card" id="authSection">
<h2>Login / Register</h2>
<input id="emailInput" type="email" placeholder="Email address">
<input id="passwordInput" type="password" placeholder="Password">
<button id="loginButton">Login</button>
<button id="registerButton">Create Account</button>
<p id="authMessage"></p>
</div>

<div id="appSection" class="hidden">

<div class="card">
<h2>Welcome to Breakfast Express!</h2>
<p id="userEmail"></p>
<button id="logoutButton" class="secondary">Logout</button>
</div>

<div class="card">
<h2>Register Your Shop</h2>
<input id="shopNameInput" placeholder="Shop name">
<input id="ownerNameInput" placeholder="Owner name">
<input id="shopPhoneInput" placeholder="Mobile number">
<input id="shopAddressInput" placeholder="Shop address">
<select id="shopAreaInput">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="shopRegisterButton">Submit for Approval</button>
<p id="shopMessage"></p>
</div>

<div class="card">
<h2>Available Shops</h2>
<div id="shopsList">Loading...</div>
</div>

<div class="card">
<h2>My Orders</h2>
<div id="myOrdersList"></div>
</div>

<div class="card hidden" id="adminPanel">
<h2>👑 Admin Dashboard</h2>
<h3>Shop Registrations</h3>
<div id="adminShopsList"></div>

<h3>Add Shop Manually</h3>
<input id="newShopName" placeholder="Shop name">
<input id="newShopPhone" placeholder="Phone">
<input id="newShopAddress" placeholder="Address">
<select id="newShopArea">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="addShopButton">Add Approved Shop</button>

<h3>All Orders</h3>
<div id="adminOrdersList"></div>
</div>

</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,collection,addDoc,getDocs,query,where,
doc,updateDoc,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const el = id => document.getElementById(id);

const firebaseConfig = {
apiKey:"AIzaSyBmLCgp-lhyVBZ18uIaGs785H55o6LcFi8",
authDomain:"project-2153778259975197488.firebaseapp.com",
projectId:"project-2153778259975197488",
storageBucket:"project-2153778259975197488.firebasestorage.app",
messagingSenderId:"854726959400",
appId:"1:854726959400:web:fc87228ca991e1a8b4b01d",
measurementId:"G-S1CFHKMLEY"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const ADMIN_UID = "SdcB4AZJ9bhNgroY7vXH7a7MN0H2";

function showApp(user) {
  el("authSection").classList.add("hidden");
  el("appSection").classList.remove("hidden");
  el("userEmail").textContent = user.email || "";

  const isAdmin = user.uid === ADMIN_UID;
  el("adminPanel").classList.toggle("hidden", !isAdmin);

  loadShops();
  loadMyOrders();

  if (isAdmin) loadAdmin();
}

function showLogin() {
  el("authSection").classList.remove("hidden");
  el("appSection").classList.add("hidden");
  el("adminPanel").classList.add("hidden");
}

el("loginButton").onclick = async () => {
  const email = el("emailInput").value.trim();
  const password = el("passwordInput").value;

  el("authMessage").textContent = "Please wait...";

  try {
    const result = await signInWithEmailAndPassword(auth,email,password);
    showApp(result.user);
    el("authMessage").textContent = "Login successful!";
  } catch(error) {
    el("authMessage").textContent = error.message;
  }
};

el("registerButton").onclick = async () => {
  try {
    const result = await createUserWithEmailAndPassword(
      auth,
      el("emailInput").value.trim(),
      el("passwordInput").value
    );
    showApp(result.user);
    el("authMessage").textContent = "Account created!";
  } catch(error) {
    el("authMessage").textContent = error.message;
  }
};

el("logoutButton").onclick = async () => {
  await signOut(auth);
  showLogin();
};

onAuthStateChanged(auth, user => {
  if (user) {
    showApp(user);
  } else {
    showLogin();
  }
});

async function loadShops() {
  el("shopsList").textContent = "Loading shops...";

  try {
    const q = query(
      collection(db,"shops"),
      where("approved","==",true),
      where("active","==",true)
    );

    const snap = await getDocs(q);
    const list = el("shopsList");
    list.innerHTML = "";

    if (snap.empty) {
      list.textContent = "No approved shops available yet.";
      return;
    }

    snap.forEach(d => {
      const s = d.data();
      const div = document.createElement("div");
      div.className = "item";

      const title = document.createElement("h3");
      title.textContent = s.name || "Shop";

      const info = document.createElement("p");
      info.textContent = (s.area || "") + " | " +
        (s.address || "") + " | " + (s.phone || "");

      const btn = document.createElement("button");
      btn.textContent = "Place Order";
      btn.onclick = () => placeOrder(d.id,s.name || "Shop");

      div.append(title,info,btn);
      list.appendChild(div);
    });
  } catch(error) {
    el("shopsList").textContent = "Shop loading error: " + error.message;
  }
}

async function placeOrder(shopId,shopName) {
  const items = prompt("Enter food item and quantity:");
  if (!items) return;

  const total = Number(prompt("Enter total amount in rupees:"));
  if (!Number.isFinite(total) || total <= 0) {
    alert("Enter a valid amount.");
    return;
  }

  const address = prompt("Enter delivery address:");
  if (!address) return;

  try {
    await addDoc(collection(db,"orders"),{
      customerId:auth.currentUser.uid,
      shopId,shopName,items,total,address,
      status:"New",
      createdAt:serverTimestamp()
    });
    alert("Order placed successfully!");
    await loadMyOrders();
  } catch(error) {
    alert("Order error: " + error.message);
  }
}

async function loadMyOrders() {
  el("myOrdersList").textContent = "Loading orders...";

  try {
    const q = query(
      collection(db,"orders"),
      where("customerId","==",auth.currentUser.uid)
    );
    const snap = await getDocs(q);
    const list = el("myOrdersList");
    list.innerHTML = "";

    if (snap.empty) {
      list.textContent = "No orders yet.";
      return;
    }

    snap.forEach(d => {
      const o = d.data();
      const div = document.createElement("div");
      div.className = "item";
      div.textContent =
        (o.shopName || "") + " | " + (o.items || "") +
        " | ₹" + o.total + " | " + o.status;
      list.appendChild(div);
    });
  } catch(error) {
    el("myOrdersList").textContent = error.message;
  }
}

async function loadAdmin() {
  try {
    const shops = await getDocs(collection(db,"shops"));
    const shopList = el("adminShopsList");
    shopList.innerHTML = "";

    shops.forEach(d => {
      const s = d.data();
      const div = document.createElement("div");
      div.className = "item";

      const info = document.createElement("p");
      info.textContent = (s.name || "Shop") + " | " +
        (s.area || "") + " | " +
        (s.approved ? "Approved" : "Pending");
      div.appendChild(info);

      if (!s.approved) {
        const approve = document.createElement("button");
        approve.textContent = "Approve Shop";
        approve.onclick = () => approveShop(d.id);
        div.appendChild(approve);
      }

      const remove = document.createElement("button");
      remove.textContent = "Delete Shop";
      remove.className = "secondary";
      remove.onclick = () => removeShop(d.id);
      div.appendChild(remove);

      shopList.appendChild(div);
    });

    const orders = await getDocs(collection(db,"orders"));
    const orderList = el("adminOrdersList");
    orderList.innerHTML = "";

    if (orders.empty) orderList.textContent = "No orders yet.";

    orders.forEach(d => {
      const o = d.data();
      const div = document.createElement("div");
      div.className = "item";

      const info = document.createElement("p");
      info.textContent = (o.shopName || "") + " | " +
        (o.items || "") + " | ₹" + o.total + " | " +
        (o.address || "") + " | " + o.status;
      div.appendChild(info);

      if (o.status !== "Completed") {
        const btn = document.createElement("button");
        btn.textContent = "Mark Completed";
        btn.onclick = () => completeOrder(d.id);
        div.appendChild(btn);
      }

      orderList.appendChild(div);
    });
  } catch(error) {
    el("adminShopsList").textContent = "Admin error: " + error.message;
    el("adminOrdersList").textContent = error.message;
  }
}

async function approveShop(id) {
  try {
    await updateDoc(doc(db,"shops",id),{approved:true});
    alert("Shop approved!");
    await loadAdmin();
    await loadShops();
  } catch(error) {
    alert(error.message);
  }
}

async function removeShop(id) {
  if (!confirm("Delete this shop?")) return;

  try {
    await deleteDoc(doc(db,"shops",id));
    await loadAdmin();
    await loadShops();
  } catch(error) {
    alert(error.message);
  }
}

async function completeOrder(id) {
  try {
    await updateDoc(doc(db,"orders",id),{status:"Completed"});
    await loadAdmin();
  } catch(error) {
    alert(error.message);
  }
}

el("shopRegisterButton").onclick = async () => {
  const user = auth.currentUser;
  if (!user) return;

  const name = el("shopNameInput").value.trim();
  const phone = el("shopPhoneInput").value.trim();
  const address = el("shopAddressInput").value.trim();

  if (!name || !phone || !address) {
    el("shopMessage").textContent = "Fill in shop name, phone and address.";
    return;
  }

  try {
    await addDoc(collection(db,"shops"),{
      name,
      ownerName:el("ownerNameInput").value.trim(),
      phone,address,
      area:el("shopAreaInput").value,
      ownerId:user.uid,
      approved:false,
      active:true,
      menu:[],
      createdAt:serverTimestamp()
    });

    el("shopMessage").textContent = "Shop submitted for approval.";
    if (user.uid === ADMIN_UID) await loadAdmin();
  } catch(error) {
    el("shopMessage").textContent = error.message;
  }
};

el("addShopButton").onclick = async () => {
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    alert("Admin access required.");
    return;
  }

  const name = el("newShopName").value.trim();
  if (!name) {
    alert("Enter shop name.");
    return;
  }

  try {
    await addDoc(collection(db,"shops"),{
      name,
      phone:el("newShopPhone").value.trim(),
      address:el("newShopAddress").value.trim(),
      area:el("newShopArea").value,
      ownerId:ADMIN_UID,
      approved:true,
      active:true,
      menu:[],
      createdAt:serverTimestamp()
    });

    alert("Shop added successfully!");
    await loadAdmin();
    await loadShops();
  } catch(error) {
    alert("Error: " + error.message);
  }
};

</script>
</body>
</html>
