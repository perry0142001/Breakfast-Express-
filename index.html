<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakfast Express</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#fff8ed;color:#333}
header{background:#e87516;color:white;padding:18px;text-align:center}
.container{max-width:750px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 7px #ddd}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#e87516;color:white;border:0;font-weight:bold}
.secondary{background:#444}
.danger{background:#b83232}
.hidden{display:none!important}
h2{color:#d96712}
.item{padding:12px 0;border-bottom:1px solid #ddd}
.small{font-size:13px;color:#666}
</style>
</head>
<body><header>
<h1>🍽️ Breakfast Express</h1>
<p>તમારો નાસ્તો, હવે તમારા ઘરે!</p>
</header><div class="container"><div class="card" id="authSection">
<h2>Login / Register</h2>
<input id="emailInput" type="email" placeholder="Email address">
<input id="passwordInput" type="password" placeholder="Password">
<button id="loginButton">Login</button>
<button id="registerButton">Create Account</button>
<p id="authMessage"></p>
</div><div id="appSection" class="hidden"><div class="card">
<h2>Welcome!</h2>
<p id="userEmail"></p>
<button id="logoutButton" class="secondary">Logout</button>
</div><div class="card">
<h2>Register Your Shop</h2>
<input id="shopNameInput" placeholder="Shop name">
<input id="ownerNameInput" placeholder="Owner name">
<input id="shopPhoneInput" placeholder="Mobile number">
<input id="shopAddressInput" placeholder="Shop address">
<select id="shopAreaInput">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="shopRegisterButton">Submit Shop for Approval</button>
<p id="shopMessage"></p>
</div><div class="card">
<h2>🍴 Available Shops</h2>
<div id="shopsList">Loading shops...</div>
</div><div class="card">
<h2>🧾 My Orders</h2>
<div id="myOrdersList"></div>
</div><div class="card" id="menuManager">
<h2>🍲 Manage Food Menu</h2>
<p class="small">Select a shop you own. Admin can select any shop.</p>
<select id="manageShopSelect">
<option value="">Select shop</option>
</select><input id="foodNameInput" placeholder="Food item name">
<input id="foodPriceInput" type="number" min="1" placeholder="Price in ₹">
<button id="saveFoodButton">Add Food Item</button>
<p id="menuMessage"></p>
<div id="manageMenuList"></div>
</div><div class="card hidden" id="adminPanel">
<h2>👑 Admin Dashboard</h2><h3>Shop Registrations</h3>
<div id="adminShopsList"></div><h3>Add Shop Manually</h3>
<input id="newShopName" placeholder="Shop name">
<input id="newShopPhone" placeholder="Phone">
<input id="newShopAddress" placeholder="Address">
<select id="newShopArea">
<option>Kudasan</option>
<option>Raysan</option>
<option>Sargasan</option>
<option>PDPU</option>
</select>
<button id="addShopButton">Add Approved Shop</button><h3>All Orders</h3>
<div id="adminOrdersList"></div>
</div></div>
</div><script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,collection,addDoc,getDocs,query,where,
doc,updateDoc,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const el = id => document.getElementById(id);

const firebaseConfig = {
apiKey:"AIzaSyBmLCgp-lhyVBZ18uIaGs785H55o6LcFi8",
authDomain:"project-2153778259975197488.firebaseapp.com",
projectId:"project-2153778259975197488",
storageBucket:"project-2153778259975197488.firebasestorage.app",
messagingSenderId:"854726959400",
appId:"1:854726959400:web:fc87228ca991e1a8b4b01d",
measurementId:"G-S1CFHKMLEY"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const ADMIN_UID = "SdcB4AZJ9bhNgroY7vXH7a7MN0H2";

let currentShops = [];
let selectedShopId = "";
let editingFoodId = "";

function isAdmin(){
return auth.currentUser?.uid === ADMIN_UID;
}

function showApp(user){
el("authSection").classList.add("hidden");
el("appSection").classList.remove("hidden");
el("userEmail").textContent = user.email || "";
el("adminPanel").classList.toggle("hidden",!isAdmin());

loadShops();
loadMyOrders();
loadManageShops();

if(isAdmin()) loadAdmin();
}

function showLogin(){
el("authSection").classList.remove("hidden");
el("appSection").classList.add("hidden");
}

el("loginButton").onclick = async()=>{
el("authMessage").textContent="Please wait...";
try{
const result=await signInWithEmailAndPassword(
auth,el("emailInput").value.trim(),el("passwordInput").value
);
showApp(result.user);
el("authMessage").textContent="Login successful!";
}catch(e){
el("authMessage").textContent=e.message;
}
};

el("registerButton").onclick=async()=>{
el("authMessage").textContent="Please wait...";
try{
const result=await createUserWithEmailAndPassword(
auth,el("emailInput").value.trim(),el("passwordInput").value
);
showApp(result.user);
}catch(e){
el("authMessage").textContent=e.message;
}
};

el("logoutButton").onclick=async()=>{
await signOut(auth);
showLogin();
};

onAuthStateChanged(auth,user=>{
if(user) showApp(user);
else showLogin();
});

async function loadShops(){
el("shopsList").textContent="Loading shops...";
try{
const q=query(collection(db,"shops"),
where("approved","==",true),
where("active","==",true));
const snap=await getDocs(q);
const list=el("shopsList");
list.innerHTML="";

if(snap.empty){
list.textContent="No approved shops available.";
return;
}

snap.forEach(d=>{
const s=d.data();
const div=document.createElement("div");
div.className="item";

const title=document.createElement("h3");
title.textContent=s.name||"Shop";

const info=document.createElement("p");
info.textContent=(s.area||"")+" | "+(s.address||"")+" | "+(s.phone||"");

div.append(title,info);

const menu=s.menu||[];
if(menu.length===0){
const noMenu=document.createElement("p");
noMenu.textContent="Menu not added yet.";
div.appendChild(noMenu);
}

menu.forEach((food,index)=>{
if(food.available===false)return;
const row=document.createElement("p");
row.textContent=food.name+" — ₹"+food.price;
div.appendChild(row);

const btn=document.createElement("button");
btn.textContent="Order "+food.name;
btn.onclick=()=>placeOrder(d.id,s.name||"Shop",food);
div.appendChild(btn);
});

list.appendChild(div);
});
}catch(e){
el("shopsList").textContent="Error: "+e.message;
}
}

async function placeOrder(shopId,shopName,food){
const quantity=Number(prompt("Enter quantity:", "1"));
if(!Number.isInteger(quantity)||quantity<1)return;

const address=prompt("Enter delivery address:");
if(!address)return;

const total=Number(food.price)*quantity;

try{
await addDoc(collection(db,"orders"),{
customerId:auth.currentUser.uid,
shopId,
shopName,
items:food.name+" x "+quantity,
total,
address,
status:"New",
createdAt:serverTimestamp()
});
alert("Order placed! Total: ₹"+total);
await loadMyOrders();
}catch(e){
alert("Order error: "+e.message);
}
}

async function loadMyOrders(){
el("myOrdersList").textContent="Loading...";
try{
const q=query(collection(db,"orders"),
where("customerId","==",auth.currentUser.uid));
const snap=await getDocs(q);
const list=el("myOrdersList");
list.innerHTML="";
if(snap.empty){
list.textContent="No orders yet.";
return;
}
snap.forEach(d=>{
const o=d.data();
const div=document.createElement("div");
div.className="item";
div.textContent=(o.shopName||"")+" | "+o.items+
" | ₹"+o.total+" | "+o.status;
list.appendChild(div);
});
}catch(e){
el("myOrdersList").textContent=e.message;
}
}

async function loadManageShops(){
try{
const snap=await getDocs(collection(db,"shops"));
currentShops=[];
const select=el("manageShopSelect");
select.innerHTML='<option value="">Select shop</option>';

snap.forEach(d=>{
const s=d.data();
if(isAdmin()||s.ownerId===auth.currentUser.uid){
currentShops.push({id:d.id,...s});
const option=document.createElement("option");
option.value=d.id;
option.textContent=s.name+(s.approved?" (Approved)":" (Pending)");
select.appendChild(option);
}
});
}catch(e){
el("menuMessage").textContent=e.message;
}
}

el("manageShopSelect").onchange=()=>{
selectedShopId=el("manageShopSelect").value;
editingFoodId="";
el("foodNameInput").value="";
el("foodPriceInput").value="";
el("saveFoodButton").textContent="Add Food Item";
renderManageMenu();
};

function renderManageMenu(){
const list=el("manageMenuList");
list.innerHTML="";
const shop=currentShops.find(s=>s.id===selectedShopId);
if(!shop){
list.textContent="Select a shop first.";
return;
}

const menu=shop.menu||[];
if(menu.length===0){
list.textContent="No food items yet.";
return;
}

menu.forEach((food,index)=>{
const div=document.createElement("div");
div.className="item";

const info=document.createElement("p");
info.textContent=food.name+" — ₹"+food.price+
" — "+(food.available===false?"Unavailable":"Available");
div.appendChild(info);

const edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>{
editingFoodId=food.id;
el("foodNameInput").value=food.name;
el("foodPriceInput").value=food.price;
el("saveFoodButton").textContent="Save Changes";
};
div.appendChild(edit);

const toggle=document.createElement("button");
toggle.textContent=food.available===false?"Make Available":"Make Unavailable";
toggle.className="secondary";
toggle.onclick=()=>toggleFood(food.id);
div.appendChild(toggle);

const remove=document.createElement("button");
remove.textContent="Delete";
remove.className="danger";
remove.onclick=()=>deleteFood(food.id);
div.appendChild(remove);

list.appendChild(div);
});
}

function makeId(){
return Date.now().toString()+"_"+Math.random().toString(36).slice(2,8);
}

el("saveFoodButton").onclick=async()=>{
if(!selectedShopId){
alert("Select a shop first.");
return;
}

const name=el("foodNameInput").value.trim();
const price=Number(el("foodPriceInput").value);

if(!name||!Number.isFinite(price)||price<=0){
alert("Enter a food name and valid price.");
return;
}

const shop=currentShops.find(s=>s.id===selectedShopId);
if(!shop)return;

let menu=[...(shop.menu||[])];

if(editingFoodId){
menu=menu.map(f=>f.id===editingFoodId?
{...f,name,price}:f);
}else{
menu.push({
id:makeId(),
name,
price,
available:true
});
}

await saveMenu(menu);
};

async function saveMenu(menu){
try{
await updateDoc(doc(db,"shops",selectedShopId),{menu});
el("menuMessage").textContent="Menu saved successfully!";
editingFoodId="";
el("foodNameInput").value="";
el("foodPriceInput").value="";
el("saveFoodButton").textContent="Add Food Item";
await loadManageShops();
el("manageShopSelect").value=selectedShopId;
renderManageMenu();
await loadShops();
}catch(e){
el("menuMessage").textContent="Save error: "+e.message;
}
}

async function toggleFood(foodId){
const shop=currentShops.find(s=>s.id===selectedShopId);
if(!shop)return;
const menu=(shop.menu||[]).map(f=>
f.id===foodId?{...f,available:f.available===false}:f
);
await saveMenu(menu);
}

async function deleteFood(foodId){
if(!confirm("Delete this food item?"))return;
const shop=currentShops.find(s=>s.id===selectedShopId);
if(!shop)return;
const menu=(shop.menu||[]).filter(f=>f.id!==foodId);
await saveMenu(menu);
}

async function loadAdmin(){
try{
const snap=await getDocs(collection(db,"shops"));
const list=el("adminShopsList");
list.innerHTML="";

snap.forEach(d=>{
const s=d.data();
const div=document.createElement("div");
div.className="item";

const info=document.createElement("p");
info.textContent=(s.name||"Shop")+" | "+(s.area||"")+
" | "+(s.approved?"Approved":"Pending");
div.appendChild(info);

if(!s.approved){
const approve=document.createElement("button");
approve.textContent="Approve Shop";
approve.onclick=()=>approveShop(d.id);
div.appendChild(approve);
}

const remove=document.createElement("button");
remove.textContent="Delete Shop";
remove.className="danger";
remove.onclick=()=>removeShop(d.id);
div.appendChild(remove);
list.appendChild(div);
});

const orders=await getDocs(collection(db,"orders"));
const orderList=el("adminOrdersList");
orderList.innerHTML="";
if(orders.empty)orderList.textContent="No orders yet.";

orders.forEach(d=>{
const o=d.data();
const div=document.createElement("div");
div.className="item";
const info=document.createElement("p");
info.textContent=(o.shopName||"")+" | "+o.items+
" | ₹"+o.total+" | "+o.address+" | "+o.status;
div.appendChild(info);

if(o.status!=="Completed"){
const btn=document.createElement("button");
btn.textContent="Mark Completed";
btn.onclick=()=>completeOrder(d.id);
div.appendChild(btn);
}
orderList.appendChild(div);
});
}catch(e){
el("adminShopsList").textContent="Admin error: "+e.message;
}
}

async function approveShop(id){
try{
await updateDoc(doc(db,"shops",id),{approved:true});
alert("Shop approved!");
await loadAdmin();
await loadShops();
await loadManageShops();
}catch(e){alert(e.message);}
}

async function removeShop(id){
if(!confirm("Delete this shop?"))return;
try{
await deleteDoc(doc(db,"shops",id));
await loadAdmin();
await loadShops();
await loadManageShops();
}catch(e){alert(e.message);}
}

async function completeOrder(id){
try{
await updateDoc(doc(db,"orders",id),{status:"Completed"});
await loadAdmin();
}catch(e){alert(e.message);}
}

el("addShopButton").onclick=async()=>{
if(!isAdmin()){
alert("Admin access required.");
return;
}
const name=el("newShopName").value.trim();
if(!name){alert("Enter shop name.");return;}

try{
await addDoc(collection(db,"shops"),{
name,
phone:el("newShopPhone").value.trim(),
address:el("newShopAddress").value.trim(),
area:el("newShopArea").value,
ownerId:ADMIN_UID,
approved:true,
active:true,
menu:[],
createdAt:serverTimestamp()
});
alert("Shop added successfully!");
await loadAdmin();
await loadShops();
await loadManageShops();
}catch(e){alert(e.message);}
};

el("shopRegisterButton").onclick=async()=>{
const user=auth.currentUser;
if(!user)return;

const name=el("shopNameInput").value.trim();
const phone=el("shopPhoneInput").value.trim();
const address=el("shopAddressInput").value.trim();

if(!name||!phone||!address){
el("shopMessage").textContent="Fill in shop name, phone and address.";
return;
}

try{
await addDoc(collection(db,"shops"),{
name,
ownerName:el("ownerNameInput").value.trim(),
phone,
address,
area:el("shopAreaInput").value,
ownerId:user.uid,
approved:false,
active:true,
menu:[],
createdAt:serverTimestamp()
});
el("shopMessage").textContent="Shop submitted for approval.";
await loadManageShops();
if(isAdmin())await loadAdmin();
}catch(e){
el("shopMessage").textContent=e.message;
}
};

</script></body>
</html>
